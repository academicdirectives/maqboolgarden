<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- ✅ MOBILE FIX -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surah & Seerah</title>

<style>
body {
    font-family:'Segoe UI',sans-serif;
    margin:0;
    background:#f1f5f2;
    overflow-x:hidden; /* ✅ prevents horizontal scroll */
}

header {
    background:#0f3d2e;
    color:#f5d36c;
    padding:12px;
    text-align:center;
    font-weight:bold;
    font-size:16px;
}

.tabs { display:flex;background:#145a42; }

.tab {
    flex:1;
    padding:10px;
    text-align:center;
    color:white;
    cursor:pointer;
    font-size:14px;
}

.active { background:#1abc9c; }

.content {
    display:none;
    padding:10px;
}
.show { display:block; }

select {
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
    font-size:14px;
}

/* ✅ CONTENT BOX FIX */
.content-box{
    background:white;
    padding:12px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
    position:relative;
    word-wrap:break-word;
    overflow-wrap:break-word;
}

/* SECTION WRAPPER */
.section{
    position:relative;
    background:white;
    padding:12px;
    border-radius:8px;
    margin-bottom:12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* AI BUTTON */
.ai-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    border:none;
    font-size:10px;
    cursor:pointer;
    position:absolute;
    top:6px;
    right:6px;
}

/* ✅ TEXT FIX */
p, li, blockquote {
    font-size:14px;
    line-height:1.5;
}

/* ✅ BLOCKQUOTE FIX */
blockquote{
    overflow-x:auto;
    word-break:break-word;
}

/* ✅ EXTRA SMALL DEVICES */
@media(max-width:400px){
    header{font-size:14px;}
    .tab{font-size:12px;padding:8px;}
}
</style>

<script>

// ===== TAB =====
function openTab(tab){
document.querySelectorAll(".content").forEach(c=>c.classList.remove("show"));
document.getElementById(tab).classList.add("show");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
event.currentTarget.classList.add("active");
}

// ===== AI HANDLERS =====

function handleSeerahAI(text){
let prompt = `${text}

ask me anything related to the above section.`;

window.open(`https://chat.openai.com/?q=${encodeURIComponent(prompt)}`);
}

function handleRukuAI(text){
let prompt = `${text}

👉 translation menu: command me to translate this in any language.
1 (Urdu), 2 (Hindi-Urdu), 3 (Bengali), 4 (Tamil),
5 (ask anything), 6 (word-by-word learning & memorization)`;

window.open(`https://chat.openai.com/?q=${encodeURIComponent(prompt)}`);
}

// ===== ADD AI BUTTONS =====

function addSeerahAI(){
let box = document.querySelector("#seerahContent .content-box");
if(!box) return;

if(box.querySelector(".ai-btn")) return;

let btn = document.createElement("button");
btn.className="ai-btn";
btn.innerText="AI";

btn.onclick = ()=>handleSeerahAI(box.innerText);

box.appendChild(btn);
}

function addVerseAI(){

document.querySelectorAll("#contentArea h3").forEach(el=>{

    if(el.parentElement.classList.contains("section")) return;

    let wrapper = document.createElement("div");
    wrapper.className = "section";

    let btn = document.createElement("button");
    btn.className = "ai-btn";
    btn.innerText = "AI";

    btn.onclick = function(){
        handleRukuAI(wrapper.innerText);
    };

    el.parentNode.insertBefore(wrapper, el);
    wrapper.appendChild(btn);

    while(el.nextSibling && !["H3","H4"].includes(el.nextSibling.tagName)){
        wrapper.appendChild(el.nextSibling);
    }

    wrapper.insertBefore(el, btn.nextSibling);
});

document.querySelectorAll("#contentArea h4").forEach(el=>{

    if(el.parentElement.classList.contains("section")) return;

    let wrapper = document.createElement("div");
    wrapper.className = "section";

    let btn = document.createElement("button");
    btn.className = "ai-btn";
    btn.innerText = "AI";

    btn.onclick = function(){
        handleRukuAI(wrapper.innerText);
    };

    el.parentNode.insertBefore(wrapper, el);
    wrapper.appendChild(btn);

    while(el.nextSibling && el.nextSibling.tagName !== "H4"){
        wrapper.appendChild(el.nextSibling);
    }

    wrapper.insertBefore(el, btn.nextSibling);
});

}

// ===== STORY AI =====
function addStoryAI(){
let box = document.querySelector("#storyContent .content-box");
if(!box) return;

if(box.querySelector(".ai-btn")) return;

let btn = document.createElement("button");
btn.className="ai-btn";
btn.innerText="AI";

btn.onclick = ()=>handleSeerahAI(box.innerText);

box.appendChild(btn);
}

// ===== CONTENT =====

const ruku4 = `

<h4>Creation of Adam</h4>

<h4>Prostration of Angels</h4>

<h4>Temptation</h4>
<p>Shaytan deceived Adam and Hawwa.</p>

<h4>Repentance</h4>
<p>Allah accepted Adam’s sincere repentance.</p>
`;

const ruku6 = ``;

const seerah4 = ``;

const story1 = ``;

const story3 = ``;

// ===== DATA =====

const rukuData = {

"1": { title:"Al-Fatiha", rukus:{ "1":{content:[""]} } },

"2": {
title:"Al-Baqarah",
rukus:{
"1":{content:[""]}, "2":{content:[""]}, "3":{content:[""]},
"4":{content:[ruku4]}, "5":{content:[""]},
"6":{content:[ruku6]}, "7":{content:[""]}, "8":{content:[""]}, "9":{content:[""]}, "10":{content:[""]},
"11":{content:[""]}, "12":{content:[""]}, "13":{content:[""]}, "14":{content:[""]}, "15":{content:[""]},
"16":{content:[""]}, "17":{content:[""]}, "18":{content:[""]}, "19":{content:[""]}, "20":{content:[""]},
"21":{content:[""]}, "22":{content:[""]}, "23":{content:[""]}, "24":{content:[""]}, "25":{content:[""]},
"26":{content:[""]}, "27":{content:[""]}, "28":{content:[""]}, "29":{content:[""]}, "30":{content:[""]},
"31":{content:[""]}, "32":{content:[""]}, "33":{content:[""]}, "34":{content:[""]}, "35":{content:[""]},
"36":{content:[""]}, "37":{content:[""]}, "38":{content:[""]}, "39":{content:[""]}, "40":{content:[""]}
}
},

"3": {
title:"Al-Imran",
rukus:{
"1":{content:[""]}, "2":{content:[""]}, "3":{content:[""]}, "4":{content:[""]}, "5":{content:[""]},
"6":{content:[""]}, "7":{content:[""]}, "8":{content:[""]}, "9":{content:[""]}, "10":{content:[""]},
"11":{content:[""]}, "12":{content:[""]}, "13":{content:[""]}, "14":{content:[""]}, "15":{content:[""]},
"16":{content:[""]}, "17":{content:[""]}, "18":{content:[""]}, "19":{content:[""]}, "20":{content:[""]}
}
},

"4": {
title:"An-Nisa",
rukus:{
"1":{content:[""]}, "2":{content:[""]}, "3":{content:[""]}, "4":{content:[""]}, "5":{content:[""]},
"6":{content:[""]}, "7":{content:[""]}, "8":{content:[""]}, "9":{content:[""]}, "10":{content:[""]},
"11":{content:[""]}, "12":{content:[""]}, "13":{content:[""]}, "14":{content:[""]}, "15":{content:[""]},
"16":{content:[""]}, "17":{content:[""]}, "18":{content:[""]}, "19":{content:[""]}, "20":{content:[""]}
}
}

};

const seerahData = {
"1":{
title:"Seerah",
chapters:{
"1": { title:"Intro", content:[""] },
"2": { title:"World Before Revelation", content:[seerah4] }
}
}
};

const storyData = {
"1": { title:"The story of Suhail (RA)", content:[story1] },
"2": { title:"The story of Salman AL- Farsi", content:[story3] }
};

// ===== FUNCTIONS (UNCHANGED) =====

function loadRukuDropdown(){
let s=document.getElementById("surahSelect").value;
let r=document.getElementById("rukuSelect");

r.innerHTML=`<option value="">Select Ruku</option>`;
if(!s) return;

for(let key in rukuData[s].rukus){
r.innerHTML+=`<option value="${key}">Ruku ${key}</option>`;
}
}

function showRuku(){
let s=document.getElementById("surahSelect").value;
let r=document.getElementById("rukuSelect").value;
if(!r) return;

let data=rukuData[s].rukus[r].content[0];

document.getElementById("contentArea").innerHTML=
`<div class="content-box">
<h2>${rukuData[s].title} - Ruku ${r}</h2>
${data}
</div>`;

setTimeout(addVerseAI,100);
}

function showSeerah(){
let ch=document.getElementById("chapterSelect").value;
if(!ch) return;

let chapter=seerahData["1"].chapters[ch];

document.getElementById("seerahContent").innerHTML=
`<div class="content-box">
${chapter.content[0]}
</div>`;

setTimeout(addSeerahAI,100);
}

function showStory(){
let ch=document.getElementById("storySelect").value;
if(!ch) return;

let story=storyData[ch];

document.getElementById("storyContent").innerHTML=
`<div class="content-box">
<h2>${story.title}</h2>
${story.content[0]}
</div>`;

setTimeout(addStoryAI,100);
}

// ===== INIT =====

window.onload=function(){

let s=document.getElementById("surahSelect");
for(let key in rukuData){
s.innerHTML+=`<option value="${key}">${key}. ${rukuData[key].title}</option>`;
}

let c=document.getElementById("chapterSelect");
for(let key in seerahData["1"].chapters){
let chapter=seerahData["1"].chapters[key];
c.innerHTML+=`<option value="${key}">Chapter ${key} - ${chapter.title}</option>`;
}

let st=document.getElementById("storySelect");
for(let key in storyData){
let story=storyData[key];
st.innerHTML+=`<option value="${key}">${story.title}</option>`;
}

};

</script>

</head>

<body>

<header>Surah & Seerah Explorer</header>

<div class="tabs">
<div class="tab active" onclick="openTab('surah')">Surah</div>
<div class="tab" onclick="openTab('seerah')">Seerah</div>
<div class="tab" onclick="openTab('story')">Story</div>
</div>

<!-- SURAH -->
<div id="surah" class="content show">

<select id="surahSelect" onchange="loadRukuDropdown()">
<option value="">Select Surah</option>
</select>

<select id="rukuSelect" onchange="showRuku()">
<option value="">Select Ruku</option>
</select>

<div id="contentArea" class="content-box">
Select Surah and Ruku
</div>

</div>

<!-- SEERAH -->
<div id="seerah" class="content">

<select id="chapterSelect" onchange="showSeerah()">
<option value="">Select Chapter</option>
</select>

<div id="seerahContent" class="content-box">
Select Chapter
</div>

</div>

<!-- STORY -->
<div id="story" class="content">

<select id="storySelect" onchange="showStory()">
<option value="">Select Story</option>
</select>

<div id="storyContent" class="content-box">
Select Story
</div>

</div>

</body>
</html>
